# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies (torch from PyTorch's CPU index)
        run: |
          # requirements.txt's torch would pull the multi-GB CUDA build; the CPU one runs every test.
          grep -vE '^(torch|open_clip_torch)([<>=! ]|$)' diykey/requirements.txt > /tmp/requirements-base.txt
          pip install -r /tmp/requirements-base.txt
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install "open_clip_torch>=2.24"
      - name: Unit tests
        run: python -m unittest discover -s diykey/tests -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile -t diykey:ci .
      - name: Smoke test
        run: docker/smoke-test.sh diykey:ci
