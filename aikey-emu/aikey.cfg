# Shared identity/config for every AI Key stage. CLI flags win over these.
# Values are placeholders except the confirmed AI-Key identity fields.

[identity]
# blank = derive from the interface's real MAC with the Ubiquiti OUI (FC:EC:DA)
mac =
hostname = aikey-emu
# Canonical type: ucp4 X-Type, /api/info and discovery TLV 0x0C.
platform = UP-AI-KEY
discovery_platform = UP-AI-KEY
sysid = 0xa5f0
# ucp4 X-Version / getInfo "version".
fw_version = 2.2.6
# Discovery advertises the longer firmware string.
discovery_fw_version = aikey.rk3588.v2.2.6.0.emu.260901.0000
# Persistent identity. Keep these stable once the console has adopted the device.
# The string device-id below is the already-deployed identity (the console accepts it);
# a fresh deployment may use a real UUID instead (protocol.md §1 says real units do).
device_id = 00000000-0000-4000-8000-000000000001
guid = 00000000-0000-4000-8000-000000000002

[network]
# blank = auto-detect the default-route interface.
iface =
# macvlan parent for core/instance_manager.py (blank = iface / auto-detect).
parent_iface =
mode = dhcp
ip =
netmask = 255.255.255.0
gateway =

[console]
# Protect console address; used only for the tokenless reconnect fallback.
host =
port = 7442

[logging]
debug = false
